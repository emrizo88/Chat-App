<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register — Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="login-body">

<div class="login-container">

    <div class="login-card">
        <div class="text-center mb-4">
            <div style="background:#25D366; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
                <span style="font-size:2rem;">💬</span>
            </div>
            <h2 class="fw-bold">Chat App</h2>
            <p class="text-muted">Regístrate para continuar</p>
        </div>

        <form action="/register" method="POST">
            <div class="mb-3">
                <label class="form-label text-muted small">USUARIO</label>
                <input type="text" name="username" class="form-control" placeholder="Tu usuario" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">CONTRASEÑA</label>
                <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Registrar</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">¿Ya tienes cuenta? <a href="/login">Inicia Sesión</a></small>
        </div>
    </div>

</div>

</body>
</html>
