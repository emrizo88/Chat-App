<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: sans-serif; background: #f0f0f0; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        #chat-box { width: 400px; height: 500px; background: white; border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        #mensajes { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
        .mensaje { background: #f0f4ff; padding: 8px 12px; border-radius: 8px; font-size: 0.9rem; }
        #formulario { display: flex; border-top: 1px solid #eee; }
        #input { flex: 1; padding: 12px; border: none; outline: none; font-size: 0.95rem; }
        #boton { padding: 12px 20px; background: #4361ee; color: white; border: none; cursor: pointer; font-size: 0.95rem; }
    
        #btn-usuarios {
            position: fixed;
            top: 16px;
            right: 16px;
            background: #4361ee;
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        #panel-usuarios {
            position: fixed;
            top: 64px;
            right: 16px;
            background: white;
            border-radius: 12px;
            padding: 1rem;
            min-width: 200px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: none;
        }

        #panel-usuarios h6 {
            margin-bottom: 0.5rem;
            color: #adb5bd;
            font-size: 0.8rem;
            text-transform: uppercase;
        }

        .usuario-item {
            padding: 6px 0;
            font-size: 0.9rem;
            border-bottom: 1px solid #f0f0f0;
        }
    
    </style>
</head>
<body>

<div id="chat-box">
    <div id="mensajes"></div>
    <form id="formulario">
        <input id="input" placeholder="Escribe un mensaje..." autocomplete="off">
        <button id="boton" type="submit">Enviar</button>
    </form>
</div>

<button id="btn-usuarios">👥</button>

<div id="panel-usuarios">
    <h6>En la sala</h6>
    <div id="lista-usuarios"></div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io()
    const nombre = prompt('Dinos tu Nombre!')
    const room = prompt('¿Que sala gustas unirte?')
    const formulario = document.getElementById('formulario')
    const input = document.getElementById('input')
    const mensajes = document.getElementById('mensajes')

    socket.emit('unirse',{nombre,room})

    formulario.addEventListener('submit', (e) => {
        e.preventDefault()
        if (input.value) {
            socket.emit('mensaje', {nombre: nombre, mensajes : input.value, room})
            input.value = ''
        }
    })

    socket.on('mensaje', (msg) => {
        const div = document.createElement('div')
        div.classList.add('mensaje')
        div.textContent = msg.nombre + ': ' + msg.mensajes
        mensajes.appendChild(div)
        mensajes.scrollTop = mensajes.scrollHeight
    })

    const btnUsuarios = document.getElementById('btn-usuarios')
    const panelUsuarios = document.getElementById('panel-usuarios')
    const listaUsuarios = document.getElementById('lista-usuarios')

    btnUsuarios.addEventListener('click', async () => {
        if (panelUsuarios.style.display === 'block') {
            panelUsuarios.style.display = 'none'
            return
        }

        const response = await fetch(`/usuarios/${room}`)
        const usuarios = await response.json()

        listaUsuarios.innerHTML = ''
        usuarios.forEach(u => {
            const div = document.createElement('div')
            div.classList.add('usuario-item')
            div.textContent = u
            listaUsuarios.appendChild(div)
        })

        panelUsuarios.style.display = 'block'
    })
</script>

</body>
</html>
