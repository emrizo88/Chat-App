<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style.css">
</head>
<body class="chat-body">

<div class="chat-layout">

    <!-- Sidebar izquierdo — rooms -->
    <div class="chat-sidebar">
        <div class="chat-sidebar-header">
            <div class="d-flex align-items-center gap-2">
                <div class="usuario-avatar-chat">
                    <span id="username-display">👤</span>
                </div>
                <span class="fw-bold">Chat App</span>
            </div>
            <button class="btn-nuevo-room" id="btn-nuevo-room" 
                data-bs-toggle="modal" 
                data-bs-target="#modalRoom"
                title="Nueva sala">+</button>
        </div>

        <div class="chat-search">
            <input type="text" id="search-rooms" placeholder="Buscar sala..." class="form-control form-control-sm">
        </div>

        <div class="rooms-lista" id="rooms-lista">
            <!-- rooms se cargan aquí -->
        </div>
    </div>

    <!-- Panel derecho — mensajes -->
    <div class="chat-main">

        <!-- Estado vacío -->
        <div class="chat-vacio" id="chat-vacio">
            <div style="background:#25D366; width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 1rem;">
                <span style="font-size:3rem;">💬</span>
            </div>
            <h4 class="fw-bold">Chat App</h4>
            <p class="text-muted">Selecciona una sala para empezar</p>
        </div>

        <!-- Chat activo -->
        <div class="chat-activo d-none" id="chat-activo">
            <div class="chat-header">
                <div class="d-flex align-items-center justify-content-between">
                    <div class="d-flex align-items-center gap-3">
                        <div class="room-avatar">💬</div>
                        <div>
                            <div class="fw-bold" id="room-nombre">Sala</div>
                            <small class="text-muted" id="room-creador"></small>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn-video" id="btn-video" title="Unirse a videollamada">
                            📹
                        </button>
                    </div>
                </div>
            </div>

            <div class="video-area d-none" id="video-area">
                <div class="videos-grid" id="videos-grid">
                    <video id="mi-video" autoplay muted playsinline></video>
                </div>
            </div>


            <div class="chat-mensajes" id="chat-mensajes"></div>

            <div class="chat-input-area">
                <form id="formulario" class="d-flex gap-2">
                    <input type="text" id="input" class="form-control" placeholder="Escribe un mensaje..." autocomplete="off">
                    <button type="submit" class="btn-enviar">➤</button>
                </form>
            </div>
        </div>

    </div>
</div>

<!-- Modal nuevo room -->
<div class="modal fade" id="modalRoom" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border-radius:16px;">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold">Nueva sala</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form action="/rooms/create" method="POST">
                    <div class="mb-4">
                        <label class="form-label text-muted small">NOMBRE DE LA SALA</label>
                        <input type="text" name="nombre" class="form-control" placeholder="Ej. General, Trabajo..." required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Crear sala</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script>
    const socket = io()
    let roomActual = null
    let userId = null
    let username = null

    // Funcionalidades Streaming
    let miStream = null
    let connections = {}
    let inCall = false

    async function iniciarVideo(){
        try{
            miStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true})
            document.getElementById('mi-video').srcObject = miStream
        }catch(error){
            console.log(error)
        }
    }

    document.getElementById('btn-video').addEventListener('click', async ()=>{
        document.getElementById('video-area').classList.remove('d-none')
        await iniciarVideo()
        inCall = true

        socket.emit('unirse-video', ({ roomId: roomActual }))
    })

    function crearConexion(socketId){
        if (connections[socketId]) return
        try{
            connections[socketId] = new RTCPeerConnection({
                iceServers: [
                    {urls: 'stun:stun.l.google.com:19302'},
                    {urls: 'stun:stun.l.google.com:19302'}
                ]
            })

            connections[socketId].onconnectionstatechange = () => {
                console.log('connections state: ', connections[socketId].connectionState)
            }

            connections[socketId].oniceconnectionstatechange = () => {
                console.log('ICE state: ', connections[socketId].iceConnectionState)
                console.log('ICE gathering: ', connections[socketId].iceGatheringState)
            }

            connections[socketId].onicegatheringstatechange = () => {
                console.log('gathering state: ', connections[socketId].iceGatheringState)
            }

            miStream.getTracks().forEach(track => {
                connections[socketId].addTrack(track,miStream)
            })

            connections[socketId].ontrack = (event) => {
                console.log('track kind:', event.track.kind)

                if (event.track.kind === 'audio') return

                if (document.getElementById('video-'+ socketId)) return
                
                document.getElementById('video-area').classList.remove('d-none')
                const video = document.createElement('video')
                video.id = 'video-' + socketId
                video.autoplay = true
                video.playsinline = true
                video.style.width = '200px'
                video.style.height = '150px'
                video.style.objectFit = 'cover'
                video.style.borderRadius = '8px'
                video.style.background = '#2d2d2d' 
                video.muted = false
                video.onloadedmetadata = () => {
                    console.log('metadata cargada: ', video.videoWidth, video.videoHeight)
                    video.play().catch(e => console.log('Error:', e))
                }
                video.onerror = (e) => {
                    console.log('Error en video: ', e)
                }

                video.onstalled =() => {
                    console.log('video estancado')
                }
                video.onplaying = () => {
                    console.log('video reproduciendo')
                }
                document.getElementById('videos-grid').appendChild(video)
                const videoTrack = event.streams[0].getVideoTracks()[0]
                console.log('track muted: ', videoTrack.muted)

                videoTrack.onunmute = () => {
                    video.srcObject = event.streams[0]
                }
                video.srcObject = event.streams[0]
            
                console.log('video agregado, dimensiones: ',video.videoWidth, video.videoHeight)
            }

            connections[socketId].onicecandidate = (event) => {
                if (event.candidate){
                    console.log('generando candidate: ', event.candidate.type, event.candidate.protocol)
                    socket.emit('icecandidates',{
                        roomId: roomActual,
                        candidate: {
                            candidate: event.candidate.candidate,
                            sdpMid: event.candidate.sdpMid,
                            sdpMLineIndex: event.candidate.sdpMLineIndex
                        }
                    })
                } else{
                    console.log('ICE Gathering Complete')
                }
            }
        }catch(error){
            console.log(error)
        }
    }

    async function crearOferta(socketId){
        if (connections[socketId]) return
        crearConexion(socketId)
        const offer = await connections[socketId].createOffer()
        await connections[socketId].setLocalDescription(offer)
        console.log('Oferta creada: ', offer)
        socket.emit('oferta',{
            roomId: roomActual,
            oferta: offer
        })
    }

    async function manejarOferta(socketId, oferta) {
        console.log('oferta llegó de:', socketId, '| conexión existe:', !!connections[socketId])
        if (connections[socketId]) return
        if (!miStream){
            await iniciarVideo()
            document.getElementById('video-area').classList.remove('d-none')
        }
        crearConexion(socketId)
        await connections[socketId].setRemoteDescription(oferta)
        const answer = await connections[socketId].createAnswer()
        await connections[socketId].setLocalDescription(answer)
        socket.emit('respuesta', {
            roomId: roomActual,
            respuesta: answer,
            para: socketId
        })
    
        // Procesa candidates pendientes
        if (iceCandidatesPendientes[socketId]) {
            for (const candidate of iceCandidatesPendientes[socketId]) {
                await connections[socketId].addIceCandidate(new RTCIceCandidate(candidate))
            }
            delete iceCandidatesPendientes[socketId]
        }
    }
    async function manejarRespuesta(socketId,respuesta){
        await connections[socketId].setRemoteDescription(respuesta)

        if (iceCandidatesPendientes[socketId]){
            for (const candidate of iceCandidatesPendientes[socketId]){
                await connections[socketId].addIceCandidate(new RTCIceCandidate(candidate))
            }
            delete iceCandidatesPendientes[socketId]
        }
    }

    let iceCandidatesPendientes = {}

    async function manejarIceCandidates(socketId, candidate){
        if (!connections[socketId] || connections[socketId].remoteDescription == null){
            if (!iceCandidatesPendientes[socketId]){
                iceCandidatesPendientes[socketId] = []
            }
            iceCandidatesPendientes[socketId].push(candidate)
            return
        }
        await connections[socketId].addIceCandidate(new RTCIceCandidate(candidate))
        console.log('candidate agregado, ICE state: ',connections[socketId].iceConnectionState)
    }


    // Cargar info del usuario
    async function cargarUsuario() {
        const res = await fetch('/api/me')
        const data = await res.json()
        userId = data.id
        username = data.username
        document.getElementById('username-display').textContent = username[0].toUpperCase()
    }

    // Cargar rooms
    async function cargarRooms() {
        const res = await fetch('/api/rooms')
        const rooms = await res.json()
        const lista = document.getElementById('rooms-lista')
        lista.innerHTML = ''
        rooms.forEach(room => {
            const div = document.createElement('div')
            div.classList.add('room-item')
            div.innerHTML = `
                <div class="room-avatar-sm">💬</div>
                <div>
                    <div class="fw-semibold">${room.nombre}</div>
                    <small class="text-muted">Creado por ${room.creado_por}</small>
                </div>
            `
            div.addEventListener('click', () => entrarRoom(room))
            lista.appendChild(div)
        })
    }

    // Entrar a un room
    async function entrarRoom(room) {
        // Actualizar UI
        document.getElementById('chat-vacio').classList.add('d-none')
        document.getElementById('chat-activo').classList.remove('d-none')
        document.getElementById('room-nombre').textContent = room.nombre
        document.getElementById('room-creador').textContent = 'Creado por ' + room.creado_por

        // Marcar room activo en sidebar
        document.querySelectorAll('.room-item').forEach(r => r.classList.remove('activo'))
        event.currentTarget.classList.add('activo')

        roomActual = room.id

        // Unirse via socket
        socket.emit('unirse', { username, roomId: room.id })

        // Cargar mensajes anteriores
        const res = await fetch(`/api/rooms/${room.id}/mensajes`)
        const mensajes = await res.json()
        const contenedor = document.getElementById('chat-mensajes')
        contenedor.innerHTML = ''
        mensajes.forEach(m => agregarMensaje(m.username, m.texto, m.username === username))
    }

    // Agregar mensaje al chat
    function agregarMensaje(nombre, texto, esMio) {
        const contenedor = document.getElementById('chat-mensajes')
        const div = document.createElement('div')
        div.classList.add('mensaje-wrapper', esMio ? 'mio' : 'otro')
        div.innerHTML = `
            <div class="mensaje-burbuja">
                ${!esMio ? `<small class="mensaje-nombre">${nombre}</small>` : ''}
                <p class="mb-0">${texto}</p>
            </div>
        `
        contenedor.appendChild(div)
        contenedor.scrollTop = contenedor.scrollHeight
    }

    // Enviar mensaje
    document.getElementById('formulario').addEventListener('submit', (e) => {
        e.preventDefault()
        const input = document.getElementById('input')
        if (input.value && roomActual) {
            socket.emit('mensaje', {
                userId,
                username,
                roomId: roomActual,
                texto: input.value
            })
            input.value = ''
        }
    })

    // Recibir mensaje
    socket.on('mensaje', (data) => {
        if (roomActual) {
            agregarMensaje(data.nombre, data.mensajes, data.nombre === username)
        }
    })

    socket.on('oferta', (data) => {
        console.log('oferta recibida de: ', data.de)
        manejarOferta(data.de, data.oferta)
    })

    socket.on('respuesta', (data) => {
        console.log('respuesta recibida de: ', data.de)
        manejarRespuesta(data.de, data.respuesta)
    })

    socket.on('icecandidates', (data) => {
        manejarIceCandidates(data.de, data.candidate)
    })

    socket.on('nuevo-en-video', async (data) => {
        console.log('nuevo-en-video recibido de: ',data.de)
        if (!inCall) return
        if (!miStream){
            await IniciarVideo()
        }
        crearOferta(data.de)
    })

    // Inicializar
    cargarUsuario()
    cargarRooms()
</script>

</body>
</html>
